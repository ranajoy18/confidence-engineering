name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio
        run: bun run build

      - name: Find static output
        id: output
        shell: bash
        run: |
          if [ -d ".output/public" ]; then
            echo "directory=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -d "dist" ]; then
            echo "directory=dist" >> "$GITHUB_OUTPUT"
          else
            echo "The build did not produce .output/public or dist."
            find . -maxdepth 3 -type d \( -name dist -o -name public \) -print
            exit 1
          fi

      - name: Prepare static output for GitHub Pages
        shell: bash
        run: |
          dir="${{ steps.output.outputs.directory }}"
          # Skip Jekyll processing, which otherwise ignores `_`-prefixed files/folders.
          touch "$dir/.nojekyll"
          # Fall back to the prerendered index on unknown paths (client-side routing).
          if [ -f "$dir/index.html" ]; then
            cp "$dir/index.html" "$dir/404.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.directory }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
